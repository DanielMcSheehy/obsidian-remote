services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - SERVICE_FQDN_APP
      - PORT=3000
      - NODE_ENV=production
      - COUCHDB_URL=http://couchdb:5984
      # Couch is internal only (expose, not ports). Hardcoded — not exposed to internet.
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=obsidian-remote-internal-do-not-expose
      # Single password that gates /api/* and the UI. Set this in Coolify.
      - APP_PASSWORD=${APP_PASSWORD:-}
      - VAULT_NAME=${VAULT_NAME:-obsidian}
      - DATA_DIR=/data
      - SURREAL_URL=http://surreal:8000
      - SURREAL_USER=root
      - SURREAL_PASSWORD=obsidian-remote-internal-do-not-expose
      - SURREAL_NS=vault
      - SURREAL_DB=memory
    volumes:
      - app_data:/data
    depends_on:
      - couchdb
      - surreal
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  couchdb:
    build: ./couchdb
    restart: unless-stopped
    expose:
      - "5984"
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=obsidian-remote-internal-do-not-expose
    volumes:
      - couch_data:/opt/couchdb/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5984/_up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  surreal:
    image: surrealdb/surrealdb:v2
    restart: unless-stopped
    command: start --log info --user root --pass obsidian-remote-internal-do-not-expose --bind 0.0.0.0:8000 rocksdb:/data
    expose:
      - "8000"
    volumes:
      - surreal_data:/data
    user: "0:0"

volumes:
  app_data:
  couch_data:
  surreal_data:
